name: CodeQL

on:
  # CodeQL builds the Xcode project on a macOS runner (10x billing weight), so
  # keep it off the hot path. It used to scan every push to main, but each
  # merged PR already runs the macOS CI build+tests on the identical code, so
  # that was a redundant ~26-min macOS run per merge. Scan only the protected
  # `release` branch (whose ruleset requires code_scanning to merge) plus on
  # demand. No schedule — a daily cron was removed in cc12bcd0 (2026-06-12);
  # not re-adding one keeps recurring macOS minutes at zero.
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [swift]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -scheme TranscribeNote -configuration Debug build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
